AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  kerykeion REST API - the kerykeion CLI as an AWS Lambda container image behind
  an API Gateway REST API. Open (no API key): cost is bounded by stage
  throttling and the function's reserved concurrency, and a budget alarm mails
  when the month gets expensive. Deploy with aws/deploy.sh.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI of the Lambda image (aws/Dockerfile), e.g. 123456789012.dkr.ecr.eu-central-1.amazonaws.com/kerykeion-api:abc1234
  StageName:
    Type: String
    Default: v1
    AllowedPattern: "[A-Za-z0-9_]+"
  MemorySize:
    Type: Number
    Default: 2048
    MinValue: 512
    MaxValue: 10240
    Description: Lambda memory in MB (CPU scales with it).
  ThrottleRateLimit:
    Type: Number
    Default: 0.1667
    Description: Steady-state requests per second, for all callers together (0.1667 = 10 per minute).
  ThrottleBurstLimit:
    Type: Number
    Default: 10
    Description: >-
      Burst requests, for all callers together: the bucket the rate refills. It
      lets one conversation fetch several charts in a row without a 429.
  ReservedConcurrency:
    Type: Number
    Default: 15
    MinValue: 1
    Description: >-
      At most this many invocations run at once. Keep it above burst + rate x
      cold start (10 + 0.17/s x ~6 s = 11): a request API Gateway lets through but
      Lambda throttles comes back as a 500, not a 429. Cost is bounded by the
      rate limit, not by this.
  BudgetEmail:
    Type: String
    Default: ""
    Description: Where the monthly budget alarm is mailed; empty skips the budget.
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    Description: Monthly cost of the whole account, in USD, that triggers the alarm.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Conditions:
  HasBudget: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  # ── Lambda ──────────────────────────────────────────────────────────────────
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: !Ref LogRetentionDays

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  Function:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: !Ref AWS::StackName
      Description: kerykeion CLI over HTTP (aws/handler/kerykeion_api.py)
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [arm64]
      MemorySize: !Ref MemorySize
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      # API Gateway gives up after 29 s; a longer Lambda timeout would only bill for answers nobody receives.
      Timeout: 29
      EphemeralStorage:
        Size: 512
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          KERYKEION_CLI_FORMAT: json

  # ── API Gateway (REST, proxy integration) ───────────────────────────────────
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Ref AWS::StackName
      Description: kerykeion astrology CLI as a REST API
      EndpointConfiguration:
        Types: [REGIONAL]

  ProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: "{proxy+}"

  RootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !GetAtt RestApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Function.Arn}/invocations

  ProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Function.Arn}/invocations

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*

  # A deployment is a snapshot of the methods: CloudFormation does not redeploy
  # when a method changes, so the logical ID is bumped whenever one does.
  DeploymentV2:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [RootMethod, ProxyMethod]
    Properties:
      RestApiId: !Ref RestApi

  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref DeploymentV2
      StageName: !Ref StageName
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: !Ref ThrottleRateLimit
          ThrottlingBurstLimit: !Ref ThrottleBurstLimit

  # ── Budget alarm ────────────────────────────────────────────────────────────
  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}
  FunctionName:
    Value: !Ref Function
