AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  kerykeion REST API - the kerykeion CLI as an AWS Lambda container image behind
  an API Gateway REST API, secured with an API key and a usage plan.
  Deploy with aws/deploy.sh, which builds and pushes the image first.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI of the Lambda image (aws/Dockerfile), e.g. 123456789012.dkr.ecr.eu-central-1.amazonaws.com/kerykeion-api:abc1234
  StageName:
    Type: String
    Default: v1
    AllowedPattern: "[A-Za-z0-9_]+"
  MemorySize:
    Type: Number
    Default: 2048
    MinValue: 512
    MaxValue: 10240
    Description: Lambda memory in MB (CPU scales with it).
  ThrottleRateLimit:
    Type: Number
    Default: 10
    Description: Steady-state requests per second for the API key.
  ThrottleBurstLimit:
    Type: Number
    Default: 20
    Description: Burst requests for the API key.
  MonthlyQuota:
    Type: Number
    Default: 50000
    Description: Requests per month for the API key.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Resources:
  # ── Lambda ──────────────────────────────────────────────────────────────────
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: !Ref LogRetentionDays

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  Function:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: !Ref AWS::StackName
      Description: kerykeion CLI over HTTP (aws/handler/kerykeion_api.py)
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [arm64]
      MemorySize: !Ref MemorySize
      # API Gateway gives up after 29 s; a longer Lambda timeout would only bill for answers nobody receives.
      Timeout: 29
      EphemeralStorage:
        Size: 512
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          KERYKEION_CLI_FORMAT: json

  # ── API Gateway (REST, proxy integration) ───────────────────────────────────
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Ref AWS::StackName
      Description: kerykeion astrology CLI as a REST API
      ApiKeySourceType: HEADER
      EndpointConfiguration:
        Types: [REGIONAL]

  ProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: "{proxy+}"

  RootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !GetAtt RestApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Function.Arn}/invocations

  ProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Function.Arn}/invocations

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*

  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [RootMethod, ProxyMethod]
    Properties:
      RestApiId: !Ref RestApi

  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref Deployment
      StageName: !Ref StageName

  # ── API key and usage plan ──────────────────────────────────────────────────
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub ${AWS::StackName}-key
      Enabled: true

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub ${AWS::StackName}-plan
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: !Ref Stage
      Throttle:
        RateLimit: !Ref ThrottleRateLimit
        BurstLimit: !Ref ThrottleBurstLimit
      Quota:
        Limit: !Ref MonthlyQuota
        Period: MONTH

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

Outputs:
  ApiUrl:
    Description: Base URL of the API (send the key in the x-api-key header)
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}
  ApiKeyId:
    Description: "Read the key value with: aws apigateway get-api-key --include-value --api-key <id>"
    Value: !Ref ApiKey
  FunctionName:
    Value: !Ref Function
